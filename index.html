<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spell & Cheer">
<title>ECS2050 Spell & Cheer</title>
<style>
* {
  box-sizing:border-box}

body {
  margin:0;
  padding:16px;
  background:linear-gradient(145deg,#fff5c7,#e9fff2);
  font-family:Arial Rounded MT Bold,system-ui,sans-serif;
  color:#18304f;
  min-height:100vh}

.app {
  max-width:1100px;
  margin:auto}

h1 {
  text-align:center;
  margin:2px 0;
  font-size:2.2rem}

.class {
  text-align:center;
  color:#654fd4;
  font-size:1.8rem;
  font-weight:900;
  margin:5px 0 10px}

.display {
  background:#fff;
  border:5px solid #ffd34e;
  border-radius:25px;
  min-height:140px;
  display:grid;
  place-items:center;
  font-size:clamp(3rem,9vw,6rem);
  font-weight:950;
  letter-spacing:.08em}

.controls {
  display:grid;
  grid-template-columns:1fr 1fr 1.4fr;
  gap:10px;
  margin:12px 0}

.control {
  border:0;
  border-radius:18px;
  padding:16px;
  color:#fff;
  font-size:1.2rem;
  font-weight:900}

.del {
  background:#f28a36}

.clear {
  background:#eb5a65}

.read {
  background:#21ab5a}

.alphabet {
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px}

.letter {
  min-height:90px;
  border:3px solid #18304f20;
  border-radius:18px;
  font-size:clamp(2.6rem,7vw,4.8rem);
  font-weight:950;
  color:#18304f;
  box-shadow:0 5px 0 #18304f30}

.status,.credit {
  text-align:center;
  font-weight:800}

.credit {
  margin-top:16px;
  color:#59677b}

.pop {
  display:none;
  position:fixed;
  inset:0;
  background:#17243db8;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:20}

.pop.show {
  display:flex}

.card {
  background:#fff;
  border:6px solid #ffd34e;
  border-radius:28px;
  padding:18px;
  width:min(560px,94vw);
  text-align:center}

.card img {
  display:block;
  max-width:100%;
  max-height:55vh;
  margin:auto;
  border-radius:20px}

.pw {
  font-size:clamp(2.5rem,8vw,5rem);
  font-weight:950;
  margin:6px}

.next {
  border:0;
  background:#21ab5a;
  color:#fff;
  border-radius:16px;
  padding:14px 24px;
  font-size:1.2rem;
  font-weight:900}

.case {
  text-align:center;
  margin-bottom:10px}

.case button {
  border:0;
  border-radius:14px;
  background:#6e82ff;
  color:#fff;
  padding:10px 20px;
  margin:0 4px;
  font-weight:900;
  font-size:1.1rem}

@media(max-width:600px) {
  .alphabet {
  grid-template-columns:repeat(4,1fr)}

.letter {
  min-height:78px}

.controls {
  grid-template-columns:1fr 1fr}

.read {
  grid-column:1/-1}

}



/* Fun creator badge */
.credit {
  width: fit-content;
  max-width: 92%;
  margin: 22px auto 8px;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: linear-gradient(135deg, #fff0a8, #ffd7ec, #cdefff);
  border: 3px solid #ffffff;
  border-radius: 999px;
  box-shadow: 0 5px 0 rgba(24, 48, 79, 0.14);
  color: #5636ad;
  text-align: center;
}
.credit-star {
  font-size: 1.55rem;
}
.credit-text {
  display: flex;
  flex-direction: column;
  line-height: 1.05;
}
.credit-small {
  font-size: 0.78rem;
  color: #58677d;
  letter-spacing: 0.04em;
}
.credit strong {
  margin-top: 3px;
  font-size: 1.08rem;
  color: #5d45c6;
}

</style>
</head>
<body>
<main class="app">
<h1>🌟 Spell &amp; Cheer&nbsp;🌟</h1>
<div class="class">ECS2050</div>
<div class="case">
<button id="upper">ABC</button>
<button id="lower">abc</button>
</div>
<div class="display" id="display">&nbsp;</div>
<div class="controls">
<button class="control del" id="del">⌫ Delete</button>
<button class="control clear" id="clear">↻ Clear</button>
<button class="control read" id="read">✓ Read Again</button>
</div>
<div class="alphabet" id="alphabet"><button class="letter" type="button" data-letter="A" style="background:#ffd05a">A</button><button class="letter" type="button" data-letter="B" style="background:#ff8e91">B</button><button class="letter" type="button" data-letter="C" style="background:#83d5f5">C</button><button class="letter" type="button" data-letter="D" style="background:#98df99">D</button><button class="letter" type="button" data-letter="E" style="background:#bca0f4">E</button><button class="letter" type="button" data-letter="F" style="background:#ffad68">F</button><button class="letter" type="button" data-letter="G" style="background:#74d7ca">G</button><button class="letter" type="button" data-letter="H" style="background:#ffd05a">H</button><button class="letter" type="button" data-letter="I" style="background:#ff8e91">I</button><button class="letter" type="button" data-letter="J" style="background:#83d5f5">J</button><button class="letter" type="button" data-letter="K" style="background:#98df99">K</button><button class="letter" type="button" data-letter="L" style="background:#bca0f4">L</button><button class="letter" type="button" data-letter="M" style="background:#ffad68">M</button><button class="letter" type="button" data-letter="N" style="background:#74d7ca">N</button><button class="letter" type="button" data-letter="O" style="background:#ffd05a">O</button><button class="letter" type="button" data-letter="P" style="background:#ff8e91">P</button><button class="letter" type="button" data-letter="Q" style="background:#83d5f5">Q</button><button class="letter" type="button" data-letter="R" style="background:#98df99">R</button><button class="letter" type="button" data-letter="S" style="background:#bca0f4">S</button><button class="letter" type="button" data-letter="T" style="background:#ffad68">T</button><button class="letter" type="button" data-letter="U" style="background:#74d7ca">U</button><button class="letter" type="button" data-letter="V" style="background:#ffd05a">V</button><button class="letter" type="button" data-letter="W" style="background:#ff8e91">W</button><button class="letter" type="button" data-letter="X" style="background:#83d5f5">X</button><button class="letter" type="button" data-letter="Y" style="background:#98df99">Y</button><button class="letter" type="button" data-letter="Z" style="background:#bca0f4">Z</button></div>
<p class="status" id="status">Tap a letter to begin.</p>
<div class="credit" aria-label="Created by Alicia Ramnarine"><span class="credit-star">⭐</span><span class="credit-text"><span class="credit-small">Made with fun by</span><strong>Alicia Ramnarine</strong></span><span class="credit-star">🌈</span></div>
</main>
<div class="pop" id="pop">
<div class="card">
<img id="pic" alt="">
<div class="pw" id="pw">
</div>
<button class="next" id="next">Next Word</button>
</div>
</div>

(() => {
  'use strict';

  const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),colors=['#ffd05a','#ff8e91','#83d5f5','#98df99','#bca0f4','#ffad68','#74d7ca'],known=new Set(['CAT', 'HAT', 'RAT', 'DOG', 'SUN', 'PIG', 'BED', 'KITE', 'HAND', 'APPLE', 'HORSE', 'BANANA', 'BEAR', 'BIRD', 'SHOE', 'SOCKS', 'COW', 'EGG', 'FISH', 'FROG', 'PIZZA']);
  let typed=[],upper=true,busy=false;
  const A=document.getElementById('alphabet'),D=document.getElementById('display'),S=document.getElementById('status');
  const shown=x=>upper?x:x.toLowerCase();document.querySelectorAll('#alphabet [data-letter]').forEach(b=>{b.onclick=()=>add(b.dataset.letter)});
  function render(){D.textContent=typed.length?typed.map(shown).join(''):'\u00a0';A.innerHTML='';letters.forEach((x,i)=>{const b=document.createElement('button');b.className='letter';b.style.background=colors[i%colors.length];b.textContent=shown(x);b.onclick=()=>add(x);A.appendChild(b)})}
  let preferredVoice=null;

  function chooseVoice(){
  const voices=window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const preferred=['Samantha','Ava','Karen','Moira','Tessa','Serena','Microsoft Aria','Microsoft Jenny','Google US English'];
  for(const name of preferred){const v=voices.find(x=>x.name.includes(name));if(v){preferredVoice=v;break;}}
  if(!preferredVoice) preferredVoice=voices.find(v=>/^en[-_]/i.test(v.lang))||voices[0]||null;
}

  if('speechSynthesis' in window){chooseVoice();speechSynthesis.onvoiceschanged=chooseVoice;}

  function speak(text,isLetter=false){
  return new Promise(resolve=>{
    if(!('speechSynthesis' in window)){resolve();return;}
    chooseVoice();
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text));
    if(preferredVoice)u.voice=preferredVoice;
    u.lang=(preferredVoice&&preferredVoice.lang)||'en-CA';
    u.rate=isLetter?0.62:0.70;
    u.pitch=1.0;
    u.volume=1;
    u.onend=resolve;u.onerror=resolve;
    speechSynthesis.speak(u);
  });
}
  async function add(x){if(busy)return;busy=true;typed.push(x);
  render();const word=typed.join('').toUpperCase();S.textContent=shown(x)+' added.';await speak(x.toLowerCase(),true);if(known.has(word)){document.getElementById('pic').src=embeddedImages[word.toLowerCase()];document.getElementById('pw').textContent=word;document.getElementById('pop').classList.add('show');await speak(word.toLowerCase(),false);cheer();await speak('Great job!',false);S.textContent='Great job! '+word+'!'}busy=false}
  function cheer(){try{const C=window.AudioContext||window.webkitAudioContext,c=new C,n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.001,n+i*.1);g.gain.exponentialRampToValueAtTime(.16,n+i*.1+.02);g.gain.exponentialRampToValueAtTime(.001,n+i*.1+.2);o.connect(g).connect(c.destination);o.start(n+i*.1);o.stop(n+i*.1+.21)});setTimeout(()=>c.close(),900)}catch(e){}}

  render()}};
  document.getElementById('clear').onclick=()=>{typed=[];
  render();S.textContent='Cleared.'};
  document.getElementById('read').onclick=()=>{if(typed.length)speak(typed.join('').toLowerCase(),false)};
  document.getElementById('upper').onclick=()=>{upper=true;
  render()};
  document.getElementById('lower').onclick=()=>{upper=false;
  render()};
  document.getElementById('next').onclick=()=>{document.getElementById('pop').classList.remove('show');typed=[];
  render();S.textContent='Tap a letter to begin.'};
  render()
})();
